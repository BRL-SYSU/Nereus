name: Deploy research homepage
on:
  workflow_dispatch:
    inputs:
      publication_approved:
        description: Scientific content, licenses and public materials have been reviewed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nereus-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.publication_approved && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run verify:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
